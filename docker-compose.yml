services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      retries: 10

  core:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jarvis:jarvis@db:5432/jarvis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
